# Prepared AI draft for the release demo (slide 12). Prompt used:
# "Write a GitHub Actions workflow that tests this repository on every push and pull request."
name: verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_release.py
