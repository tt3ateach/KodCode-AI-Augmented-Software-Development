name: Verify Work Items
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    name: API tests and release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Full suite, startup, health and business probe
        run: python scripts/verify_release.py
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Node unit tests
        working-directory: app/static
        run: node --test tests/*.test.mjs
